publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  flutter_timezone: ^5.0.2
  google_fonts: ^8.0.2
  path_provider: ^2.1.5
  phosphor_flutter: ^2.1.0
